services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "54321:5432"
    volumes:
      - mall_postgres:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

  server:
    image: golang:1.25.5-alpine
    depends_on:
      - db
      - redis
    environment:
      APP_PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me}
      GOPROXY: https://goproxy.cn,direct
    working_dir: /app
    volumes:
      - ..:/app
    command: >
      sh -c "cd /app/cmd/server && go build -o main . && ./main"
    ports:
      - "8080:8080"

volumes:
  mall_postgres:
